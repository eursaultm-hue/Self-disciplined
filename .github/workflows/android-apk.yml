name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/ai-learning-os-v06
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Next.js web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set Android version from package.json
        run: node scripts/set-android-version.mjs

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare versioned APK artifact
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          cp android/app/build/outputs/apk/debug/app-debug.apk "self-disciplined-v${VERSION}.apk"
          echo "APK_NAME=self-disciplined-v${VERSION}.apk" >> "$GITHUB_ENV"
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: self-disciplined-apk-v${{ env.APP_VERSION }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${APP_VERSION}"
          NOTES="自律ROBOT ${TAG}：逾期任务识别、执行复盘和版本化 APK 构建。"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$APK_NAME" --title "自律ROBOT ${TAG}" --notes "$NOTES"
          else
            gh release upload "$TAG" "$APK_NAME" --clobber
          fi
