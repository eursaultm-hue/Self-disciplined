name: Build Android APK

# Pushes to the packaging branch intentionally trigger a real APK build.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ai-steward-v03
      - main
      - feature/ai-agent-v04
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build Next.js web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set Android version
        working-directory: android
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          s = s.replace("versionCode 1", "versionCode 5").replace('versionName "1.0"', 'versionName "0.5.0"')
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare APK artifact
        working-directory: android
        run: cp app/build/outputs/apk/debug/app-debug.apk ../self-disciplined-v0.5.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: self-disciplined-apk-v0.5.0
          path: self-disciplined-v0.5.0.apk
