name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/ai-learning-os-v06
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build Next.js web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set Android version
        working-directory: android
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          s = s.replace("versionCode 1", "versionCode 9").replace('versionName "1.0"', 'versionName "0.8.1"')
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare APK artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk self-disciplined-v0.8.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: self-disciplined-apk-v0.8.1
          path: self-disciplined-v0.8.0.apk

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.8.1"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" self-disciplined-v0.8.0.apk --title "自律ROBOT V0.8.1" --notes "V0.8.1 知识点、SRS、任务与今日计划闭环。"
          else
            gh release upload "$TAG" self-disciplined-v0.8.0.apk --clobber
          fi
